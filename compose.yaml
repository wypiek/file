services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PublicUrl: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      Storage__MaxFileBytes: ${MAX_FILE_BYTES:?Set MAX_FILE_BYTES in .env}
      Storage__QuotaBytes: ${STORAGE_QUOTA_BYTES:?Set STORAGE_QUOTA_BYTES in .env}
      Storage__UploadKey: ${UPLOAD_KEY:-}
    ports:
      - "${HTTP_PORT:?Set HTTP_PORT in .env}:6968"
    volumes:
      - files:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  files:
