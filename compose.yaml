services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PublicUrl: ${PUBLIC_URL:-http://localhost:6968}
      Storage__MaxFileBytes: ${MAX_FILE_BYTES:-104857600}
      Storage__QuotaBytes: ${STORAGE_QUOTA_BYTES:-10737418240}
      Storage__UploadKey: ${UPLOAD_KEY:-}
    ports:
      - "6968:6968"
    volumes:
      - files:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  files:
