services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PublicUrl: ${PUBLIC_URL:-http://localhost:8080}
      Storage__MaxFileBytes: ${MAX_FILE_BYTES:-104857600}
      Storage__QuotaBytes: ${STORAGE_QUOTA_BYTES:-10737418240}
      Storage__UploadKey: ${UPLOAD_KEY:-}
    volumes:
      - files:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  caddy:
    build:
      context: .
      dockerfile: deploy/Caddy.Dockerfile
    pull_policy: never
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      NO_PROXY: app,localhost,127.0.0.1,::1
      no_proxy: app,localhost,127.0.0.1,::1
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    security_opt: [no-new-privileges:true]
volumes:
  files:
  caddy_data:
  caddy_config:
